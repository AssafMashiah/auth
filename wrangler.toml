name = "auth"
main = "src/index.ts"
account_id = "5eab29f46ec31fb183a82b0861479d5c"
compatibility_date = "2024-09-23"
compatibility_flags = [ "nodejs_compat" ]

# Cloudflare Routes - Configure these for your domain
routes = [
  { pattern = "auth.buildingis.art", zone_name = "buildingis.art", custom_domain = true }
]

# Serve admin UI static files
[assets]
directory = "./admin/dist"
binding = "ASSETS"
run_worker_first = true

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "auth-db"
database_id = "e3413ce5-42f6-4336-aaba-c8e4bd3fb0dd"
migrations_dir = "migrations"

# Cloudflare Email Service binding (zero-config, needs domain onboarding)
[[send_email]]
name = "EMAIL"

# Secrets (set these via wrangler secret put <SECRET_NAME>)
# These are sensitive values that should NEVER be committed to version control
#
# REQUIRED SECRETS:
# - ADMIN_SESSION_SECRET: Secret key for admin session management
#   Set with: wrangler secret put ADMIN_SESSION_SECRET
#
# - AUTH_BOOTSTRAP_SECRET: Required to issue and complete initial super-admin setup
#   Set with: wrangler secret put AUTH_BOOTSTRAP_SECRET
#
# - ENCRYPTION_KEY: Key for encrypting sensitive data (32 bytes, base64 encoded)
#   Set with: wrangler secret put ENCRYPTION_KEY
#
# OPTIONAL SECRETS (for Cloudflare Email provider):
# - CF_ACCOUNT_ID: Cloudflare Account ID — default for the Cloudflare email provider
#   Set with: wrangler secret put CF_ACCOUNT_ID
#   (Can be overridden per-provider via the admin dashboard)
#
# - CF_API_TOKEN: Cloudflare API Token with email sending permissions
#   Set with: wrangler secret put CF_API_TOKEN
#   (Can be overridden per-provider via the admin dashboard)
#
# NON-SECRET VARS (configure via [vars] in this file, or `wrangler deploy --var`):
# - ADMIN_DOMAIN: Comma-separated origins allowed to call /api/admin/* with
#   credentials (e.g. the admin UI origin). Used by corsMiddleware.
# - CLIENT_ORIGINS: Comma-separated origins allowed to call /api/auth/* with
#   credentials (tenant web apps, marketing sites). Separate from ADMIN_DOMAIN
#   so client allowlisting never grants CORS-based access to admin APIs - those
#   remain gated by adminAuthMiddleware (session cookie + CSRF). Origins are
#   matched exactly (scheme + host + port); no wildcards or subdomain globs.
#
#   Required clients for the Sharp Thought tenant:
#     https://service.sharpthought.app,https://admin.sharpthought.app,https://www.sharpthought.app
#   Set with (example):
#     [vars]
#     CLIENT_ORIGINS = "https://service.sharpthought.app,https://admin.sharpthought.app,https://www.sharpthought.app"
#

[vars]
# Approved Sharp Thought client origins (comma-separated, exact-match).
# These are the only origins permitted to call /api/auth/* with credentials.
# ADMIN_DOMAIN is intentionally not pinned here - it is per-environment and
# stays in [env.production]/[env.dev] blocks (or as a secret).
CLIENT_ORIGINS = "https://service.sharpthought.app,https://admin.sharpthought.app,https://www.sharpthought.app"

[observability]
enabled = true
