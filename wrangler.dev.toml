name = "auth-dev"
main = "src/index.ts"
account_id = "5eab29f46ec31fb183a82b0861479d5c"
compatibility_date = "2024-09-23"
compatibility_flags = [ "nodejs_compat" ]

# Cloudflare Routes - dev environment
routes = [
  { pattern = "auth-dev.buildingis.art", zone_name = "buildingis.art", custom_domain = true }
]

# Serve admin UI static files
[assets]
directory = "./admin/dist"
binding = "ASSETS"
run_worker_first = true

# D1 Database binding - dev database
[[d1_databases]]
binding = "DB"
database_name = "auth-db-dev"
database_id = "022214a8-55b6-44ce-8268-e8c92f7d15c6"
migrations_dir = "migrations"

# Cloudflare Email Service binding (zero-config)
[[send_email]]
name = "EMAIL"

# Secrets (set these via wrangler secret put <SECRET_NAME> --env dev)
# Same secrets needed as production but with different values for dev.

# Approved Sharp Thought client origins for the dev environment.
# Mirrors wrangler.toml so future dev deploys do not silently drop the
# actual user origin (https://web.sharpthought.app). See
# test/config/client-origins-config.test.ts for the regression guard.
[vars]
CLIENT_ORIGINS = "https://service.sharpthought.app,https://web.sharpthought.app,https://admin.sharpthought.app,https://www.sharpthought.app"

[observability]
enabled = true
